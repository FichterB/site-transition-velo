<!DOCTYPE html>
<!-- Visuel Instagram général de l'opération, 1080 × 1350. Export PNG avec Chrome headless (voir lundi-27-6.html). -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{background:#1C232B;color:#fff;font-family:'Hanken Grotesk',Arial,sans-serif;display:flex;flex-direction:column;padding-bottom:52px}
  .top{display:flex;align-items:center;gap:18px;padding:56px 64px 0}
  .tuile{background:#fff;border-radius:10px;padding:12px 18px;display:flex;align-items:center}
  .tuile img{display:block}
  .x{color:#8A8271;font-size:26px}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:112px;line-height:1.02;padding:40px 64px 0}
  h1 span{color:#FF8A72}
  .sous{padding:16px 64px 0;font-size:31px;line-height:1.35;color:#D8D3C8}
  .sous b{color:#fff}
  .grille{margin:34px 64px 0;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .v{background:#fff;border-radius:14px;height:288px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .v img{width:350px;height:auto;display:block;margin-top:34px}
  .v span{position:absolute;left:18px;top:14px;font-size:21px;font-weight:800;color:#1C232B;text-transform:uppercase;letter-spacing:1px}
  .bas{margin:auto 64px 0;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #39424C;padding-top:24px;font-size:27px;color:#D8D3C8}
  .bas b{color:#fff;font-size:40px;font-weight:800;display:block}
</style>
</head>
<body>
  <div class="top">
    <div class="tuile"><img src="logo-cyclable.jpg" width="150" height="57" alt="Cyclable"></div>
    <span class="x">×</span>
    <div class="tuile"><img src="logo-moustache.png" width="160" height="42" alt="Moustache Bikes"></div>
  </div>

  <h1>Saison des cadeaux<br><span>jusqu’à −37&nbsp;%</span></h1>
  <p class="sous"><b>21 vélos électriques Moustache</b> en promotion, de la ville au VTT.<br>Quantités limitées, à essayer en magasin.</p>

  <div class="grille">
    <div class="v"><img src="lundi-27-6.webp" alt=""><span>Ville</span></div>
    <div class="v"><img src="samedi-28-es.webp" alt=""><span>Trekking &amp; VTC</span></div>
    <div class="v"><img src="dimanche-28-4.webp" alt=""><span>Route &amp; gravel</span></div>
    <div class="v"><img src="game-160-7.webp" alt=""><span>VTT</span></div>
  </div>

  <div class="bas">
    <div><b>04 86 84 10 32</b>Cyclable Valence – Saint-Péray</div>
    <div style="text-align:right">13 avenue du 8 Mai<br>07130 Saint-Péray</div>
  </div>
</body>
</html>
