<!DOCTYPE html>
<!-- Story Instagram 1080 × 1920. Zones masquées par Instagram : ~250 px en haut (barre de progression, nom du compte) et ~300 px en bas (réponse) ; le contenu important reste entre les deux. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1920px;overflow:hidden}
  body{background:#1C232B;color:#fff;font-family:'Hanken Grotesk',Arial,sans-serif;display:flex;flex-direction:column;align-items:center;text-align:center;padding:250px 72px 0}
  .logos{display:flex;align-items:center;gap:18px}
  .tuile{background:#fff;border-radius:10px;padding:12px 18px;display:flex;align-items:center}
  .tuile img{display:block}
  .x{color:#8A8271;font-size:26px}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;text-transform:uppercase;font-size:112px;line-height:1;margin-top:56px;white-space:nowrap}
  h1 span{color:#FF8A72;display:block;font-size:150px;margin-top:24px}
  .sous{margin-top:30px;font-size:36px;line-height:1.35;color:#D8D3C8}
  .sous b{color:#fff}
  .grille{margin-top:48px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .v{background:#fff;border-radius:14px;height:240px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .v img{width:310px;height:auto;display:block;margin-top:30px}
  .v span{position:absolute;left:18px;top:14px;font-size:21px;font-weight:800;color:#1C232B;text-transform:uppercase;letter-spacing:1px}
  .tel{margin-top:52px;font-size:30px;color:#D8D3C8}
  .tel b{display:block;color:#fff;font-size:64px;font-weight:800;letter-spacing:1px}
</style>
</head>
<body>
  <div class="logos">
    <div class="tuile"><img src="logo-cyclable.jpg" width="150" height="57" alt="Cyclable"></div>
    <span class="x">×</span>
    <div class="tuile"><img src="logo-moustache.png" width="160" height="42" alt="Moustache Bikes"></div>
  </div>

  <h1>Saison des cadeaux<span>jusqu’à −37&nbsp;%</span></h1>
  <p class="sous"><b>21 vélos électriques Moustache</b><br>de la ville au VTT · quantités limitées</p>

  <div class="grille">
    <div class="v"><img src="lundi-27-6.webp" alt=""><span>Ville</span></div>
    <div class="v"><img src="samedi-28-es.webp" alt=""><span>Trekking &amp; VTC</span></div>
    <div class="v"><img src="dimanche-28-4.webp" alt=""><span>Route &amp; gravel</span></div>
    <div class="v"><img src="game-160-7.webp" alt=""><span>VTT</span></div>
  </div>

  <p class="tel"><b>04 86 84 10 32</b>Cyclable Valence – Saint-Péray</p>
</body>
</html>
