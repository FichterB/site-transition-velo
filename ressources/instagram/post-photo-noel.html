<!DOCTYPE html>
<!-- Post Instagram 1080 × 1350 avec la photo du magasin (vélo décoré pour Noël). Export PNG avec Chrome headless, voir lundi-27-6.html. -->
<html lang="fr">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{position:relative;font-family:'Hanken Grotesk',Arial,sans-serif;color:#fff;background:#1C232B}
  .photo{position:absolute;left:0;top:-45px;width:1080px;height:auto}
  .degrade{position:absolute;left:0;right:0;bottom:0;height:330px;background:linear-gradient(to bottom,rgba(20,26,32,0) 0%,rgba(20,26,32,.85) 40%,rgba(20,26,32,.97) 100%)}
  .remise{position:absolute;top:300px;left:44px;background:#fff;color:#1C232B;border-radius:14px;padding:16px 22px 14px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  .remise small{display:block;font-weight:800;font-size:22px;letter-spacing:2px}
  .remise b{display:block;font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:84px;line-height:1;color:#D4412B}
  .texte{position:absolute;left:56px;right:56px;bottom:40px}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:88px;line-height:1;text-transform:uppercase}
  .sous{margin-top:10px;font-size:29px;color:#E8E3D8}
  .sous b{color:#fff}
  .tel{margin-top:14px;padding-top:14px;border-top:2px solid rgba(255,255,255,.25);display:flex;justify-content:space-between;align-items:baseline;font-size:27px;color:#D8D3C8}
  .tel b{color:#fff;font-size:40px;font-weight:800}
  .cta{margin-top:20px;display:flex;align-items:center;gap:24px}
  .bouton{background:#D4412B;color:#fff;font-weight:800;font-size:36px;padding:18px 34px;border-radius:14px}
  .bio{font-size:28px;font-weight:800;color:#fff;border-bottom:3px solid #FF8A72;padding-bottom:4px}
</style>
</head>
<body>
  <img class="photo" src="photo-magasin-noel.jpg" alt="Vélo électrique décoré pour Noël au magasin Cyclable de Saint-Péray">
  <div class="degrade"></div>
  <div class="remise"><small>JUSQU’À</small><b>−37&nbsp;%</b></div>
  <div class="texte">
    <h1>Saison des cadeaux</h1>
    <p class="sous"><b>21 vélos électriques Moustache</b></p>
    <div class="cta"><span class="bouton">Voir les promos&nbsp;→</span><span class="bio">Lien dans la bio</span></div>
  </div>
</body>
</html>
