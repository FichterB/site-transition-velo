# Déploiement du site Transition Vélo par SFTP (hébergement OVH mutualisé)
# - Push sur main        → préproduction (dossier www/preprod/), suivi GA désactivé
# - Lancement manuel     → préproduction ou production (onglet Actions > Déployer > Run workflow)
#
# Secrets (Settings > Secrets and variables > Actions > Secrets) :
#   FTP_PASSWORD     mot de passe SFTP OVH (obligatoire)
#   MISSIVE_TOKEN    jeton API Missive (optionnel) : récap posté dans Missive à chaque mise en production
# Variable (onglet Variables, optionnelle) :
#   MISSIVE_ORGANIZATION  ID de l'organisation Missive, pour que la conversation soit partagée avec l'équipe
# Le reste des réglages est dans le bloc env ci-dessous.
#
# Les fichiers sont envoyés et remplacés, jamais supprimés sur le serveur.

name: Déployer

on:
  push:
    branches: [main]
    paths: ['site/**']
  workflow_dispatch:
    inputs:
      cible:
        description: 'Où déployer ?'
        type: choice
        options: [preprod, production]
        default: preprod

concurrency:
  group: deploy-${{ github.event.inputs.cible || 'preprod' }}
  cancel-in-progress: false

env:
  SFTP_HOST: ftp.cluster029.hosting.ovh.net
  SFTP_PORT: 22
  SFTP_USER: xszitdx
  # dossiers relatifs au dossier personnel du compte OVH
  DIR_PROD: www/
  DIR_PREPROD: www/preprod/

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pour déplacer l'étiquette git « production » après chaque mise en production
    environment: ${{ github.event.inputs.cible || 'preprod' }}
    env:
      CIBLE: ${{ github.event.inputs.cible || 'preprod' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # historique complet : sert au récap des changements depuis la dernière production

      - name: Vérifier la syntaxe de config.js
        run: node --check site/config.js

      - name: Préprod — couper Google Analytics et Clarity, bloquer l'indexation
        if: env.CIBLE == 'preprod'
        run: |
          sed -i "s/ga4Id: *'[^']*'/ga4Id: ''/; s/clarityId: *'[^']*'/clarityId: ''/" site/config.js
          # robots.txt n'est lu qu'à la racine : on passe par un en-tête HTTP (hébergement Apache)
          printf 'Header set X-Robots-Tag "noindex, nofollow"\n' > site/.htaccess

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer en SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Le secret FTP_PASSWORD n'est pas défini (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "$CIBLE" = "production" ]; then DEST="$DIR_PROD"; else DEST="$DIR_PREPROD"; fi
          echo "Envoi de site/ vers $DEST"
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 2
            set net:timeout 30
            open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST
            mirror --reverse --verbose --exclude-glob .DS_Store site/ $DEST
          "

      # ---------- Récap de mise en production (production uniquement) ----------
      # L'étiquette git « production » marque la version en ligne : le récap liste les commits depuis la précédente.
      - name: Production — préparer le récap des changements
        if: env.CIBLE == 'production'
        id: recap
        run: |
          if git rev-parse -q --verify refs/tags/production >/dev/null; then
            PREV=$(git rev-parse --short production)
            LOG=$(git log --no-merges --format='- %s' production..HEAD)
            DEPUIS="depuis la mise en production précédente ($PREV)"
          else
            LOG=$(git log --no-merges --format='- %s' -n 15)
            DEPUIS="(première mise en production suivie : 15 derniers changements)"
          fi
          [ -z "$LOG" ] && LOG="- Aucun nouveau changement (redéploiement de la même version)"
          {
            echo "**Mise en production** de https://transitionvelo.net par ${{ github.actor }}"
            echo "Version \`$(git rev-parse --short HEAD)\` — $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
            echo
            echo "Changements $DEPUIS :"
            echo "$LOG"
            echo
            echo "[Détail du déploiement](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > recap.md
          cat recap.md

      - name: Production — poster le récap dans Missive
        if: env.CIBLE == 'production'
        continue-on-error: true   # un souci Missive ne doit jamais faire échouer la mise en production
        env:
          MISSIVE_TOKEN: ${{ secrets.MISSIVE_TOKEN }}
          MISSIVE_ORGANIZATION: ${{ vars.MISSIVE_ORGANIZATION }}
        run: |
          if [ -z "$MISSIVE_TOKEN" ]; then
            echo "::notice::Secret MISSIVE_TOKEN absent : récap non envoyé à Missive."
            exit 0
          fi
          # Une référence fixe : la 1re fois Missive crée la conversation, ensuite il y ajoute chaque récap
          jq -n --rawfile md recap.md --arg org "$MISSIVE_ORGANIZATION" '{posts: ({
              references: ["<deploiements@transitionvelo.net>"],
              conversation_subject: "Mises en production — transitionvelo.net",
              username: "Déploiement site",
              notification: { title: "Site mis en production", body: "transitionvelo.net est à jour" },
              conversation_color: "good",
              add_to_inbox: true,
              markdown: $md
            } + (if $org != "" then { organization: $org } else {} end))}' > payload.json
          curl -sS --fail-with-body -X POST https://public.missiveapp.com/v1/posts \
            -H "Authorization: Bearer $MISSIVE_TOKEN" -H "Content-Type: application/json" \
            --data @payload.json

      - name: Production — marquer la version en ligne
        if: env.CIBLE == 'production'
        run: |
          git tag -f production
          git push -f origin refs/tags/production
