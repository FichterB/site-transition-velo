# Déploiement du site Transition Vélo par SFTP (hébergement OVH mutualisé)
# - Push sur main         → préproduction (dossier www/preprod/), GA4 et Clarity coupés
# - Merge main → production (pull request sur GitHub) → production (dossier www/)
# - Lancement manuel      → redéployer la préprod (branche choisie) ou la production (branche production)
#
# Secrets (Settings > Secrets and variables > Actions > Secrets) :
#   FTP_PASSWORD     mot de passe SFTP OVH (obligatoire)
#   MISSIVE_TOKEN    jeton API Missive (optionnel) : récap posté dans Missive à chaque mise en production
# Variables (onglet Variables, optionnelles) :
#   MISSIVE_CONVERSATION  ID d'une conversation Missive existante (partagée avec l'équipe) où poster les récaps
#   MISSIVE_ORGANIZATION  à défaut, ID de l'organisation Missive : la conversation créée sera partagée avec l'équipe
# Le reste des réglages est dans le bloc env ci-dessous.
#
# Les fichiers sont envoyés et remplacés, jamais supprimés sur le serveur.

name: Déployer

on:
  push:
    branches: [main, production]
    paths: ['site/**']
  workflow_dispatch:
    inputs:
      cible:
        description: 'Où déployer ?'
        type: choice
        options: [preprod, production]
        default: preprod

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cible || (github.ref_name == 'production' && 'production' || 'preprod') }}
  cancel-in-progress: false

env:
  SFTP_HOST: ftp.cluster029.hosting.ovh.net
  SFTP_PORT: 22
  SFTP_USER: xszitdx
  # dossiers relatifs au dossier personnel du compte OVH
  DIR_PROD: www/
  DIR_PREPROD: www/preprod/

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Cible : production pour la branche production (ou un lancement manuel « production »), préprod sinon
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cible || (github.ref_name == 'production' && 'production' || 'preprod') }}
    env:
      CIBLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cible || (github.ref_name == 'production' && 'production' || 'preprod') }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v5
        with:
          # lancement manuel « production » : toujours la branche production, quelle que soit la branche choisie
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cible == 'production' && 'production' || '' }}
          fetch-depth: 0   # historique complet : sert au récap des changements

      - name: Vérifier la syntaxe de config.js
        run: node --check site/config.js

      - name: Préprod — couper Google Analytics et Clarity, bloquer l'indexation
        if: env.CIBLE == 'preprod'
        run: |
          sed -i "s/ga4Id: *'[^']*'/ga4Id: ''/; s/clarityId: *'[^']*'/clarityId: ''/" site/config.js
          # robots.txt n'est lu qu'à la racine : on passe par un en-tête HTTP (hébergement Apache)
          printf 'Header set X-Robots-Tag "noindex, nofollow"\n' > site/.htaccess

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Envoyer en SFTP
        env:
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$LFTP_PASSWORD" ]; then
            echo "::error::Le secret FTP_PASSWORD n'est pas défini (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "$CIBLE" = "production" ]; then DEST="$DIR_PROD"; else DEST="$DIR_PREPROD"; fi
          echo "Envoi de site/ vers $DEST"
          lftp -c "
            set sftp:auto-confirm yes
            set net:max-retries 2
            set net:timeout 30
            open --env-password -u $SFTP_USER -p $SFTP_PORT sftp://$SFTP_HOST
            mirror --reverse --verbose --exclude-glob .DS_Store site/ $DEST
          "

      # ---------- Récap de mise en production (production uniquement) ----------
      # Le récap liste les commits apportés par le merge sur la branche production.
      - name: Production — préparer le récap des changements
        if: env.CIBLE == 'production'
        id: recap
        env:
          AVANT: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            LOG="- Aucun nouveau changement (redéploiement manuel de la version en ligne)"
            DEPUIS="dans ce déploiement"
          elif [ -n "$AVANT" ] && ! echo "$AVANT" | grep -q '^0*$' && git cat-file -e "$AVANT" 2>/dev/null; then
            LOG=$(git log --no-merges --format='- %s' "$AVANT..HEAD")
            DEPUIS="depuis la mise en production précédente ($(git rev-parse --short "$AVANT"))"
          else
            LOG=$(git log --no-merges --format='- %s' -n 15)
            DEPUIS="(15 derniers changements)"
          fi
          [ -z "$LOG" ] && LOG="- Aucun nouveau changement (redéploiement de la même version)"
          {
            echo "**Mise en production** de https://transitionvelo.net par ${{ github.actor }}"
            echo "Version \`$(git rev-parse --short HEAD)\` — $(TZ=Europe/Paris date '+%d/%m/%Y à %H:%M')"
            echo
            echo "Changements $DEPUIS :"
            echo "$LOG"
            echo
            echo "[Détail du déploiement](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > recap.md
          cat recap.md

      - name: Production — poster le récap dans Missive
        if: env.CIBLE == 'production'
        continue-on-error: true   # un souci Missive ne doit jamais faire échouer la mise en production
        env:
          MISSIVE_TOKEN: ${{ secrets.MISSIVE_TOKEN }}
          MISSIVE_ORGANIZATION: ${{ vars.MISSIVE_ORGANIZATION }}
          MISSIVE_CONVERSATION: ${{ vars.MISSIVE_CONVERSATION }}
        run: |
          if [ -z "$MISSIVE_TOKEN" ]; then
            echo "::notice::Secret MISSIVE_TOKEN absent : récap non envoyé à Missive."
            exit 0
          fi
          API=https://public.missiveapp.com/v1
          AUTH="Authorization: Bearer $MISSIVE_TOKEN"

          # Conversation donnée : on supprime d'abord les récaps précédents (posts signés « Déploiement site »
          # uniquement, jamais les emails ni les commentaires). Le jeton doit appartenir à un admin Missive.
          if [ -n "$MISSIVE_CONVERSATION" ]; then
            : > anciens.txt; UNTIL=""
            for page in $(seq 1 20); do
              R=$(curl -sS --fail-with-body -H "$AUTH" "$API/conversations/$MISSIVE_CONVERSATION/posts?limit=10${UNTIL:+&until=$UNTIL}") || { echo "::warning::Lecture des posts Missive impossible : $R"; break; }
              N=$(echo "$R" | jq '.posts | length')
              [ "$N" = "0" ] && break
              echo "$R" | jq -r '.posts[] | select(.username == "Déploiement site") | .id' >> anciens.txt
              NEXT=$(echo "$R" | jq '[.posts[].created_at] | min')
              [ "$NEXT" = "$UNTIL" ] && break
              UNTIL=$NEXT
            done
            sort -u anciens.txt | while read -r id; do
              curl -sS --fail-with-body -X DELETE -H "$AUTH" "$API/posts/$id" >/dev/null \
                && echo "Ancien récap supprimé : $id" || echo "::warning::Suppression du post $id refusée par Missive"
            done
          fi

          # Conversation donnée (MISSIVE_CONVERSATION) ; sinon une référence fixe :
          # la 1re fois Missive crée la conversation, ensuite il y ajoute chaque récap
          jq -n --rawfile md recap.md --arg org "$MISSIVE_ORGANIZATION" --arg conv "$MISSIVE_CONVERSATION" '{posts: ({
              username: "Déploiement site",
              notification: { title: "Site mis en production", body: "transitionvelo.net est à jour" },
              conversation_color: "good",
              add_to_inbox: true,
              markdown: $md
            }
            + (if $conv != "" then { conversation: $conv }
               else { references: ["<deploiements@transitionvelo.net>"], conversation_subject: "Mises en production — transitionvelo.net" } end)
            + (if $org != "" then { organization: $org } else {} end))}' > payload.json
          curl -sS --fail-with-body -X POST "$API/posts" \
            -H "$AUTH" -H "Content-Type: application/json" \
            --data @payload.json
